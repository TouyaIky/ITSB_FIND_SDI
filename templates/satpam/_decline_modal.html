<div class="modal" id="declineModal" role="dialog" aria-modal="true" aria-labelledby="declineTitle"><div class="modal-box" style="max-width:480px">
  <button class="modal-x" data-modal-close aria-label="Tutup"><i data-lucide="x" class="i"></i></button>
  <h3 id="declineTitle" style="margin-bottom:.4rem">Tolak laporan</h3>
  <p style="margin-bottom:1rem"><b data-decline-name></b></p>
  <form method="post" id="declineForm" data-once novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}"><input type="hidden" name="status" value="declined">
    <div class="field"><label for="declineReason">Alasan penolakan</label>
      <textarea class="textarea" id="declineReason" name="reason" required minlength="5" maxlength="500" style="min-height:100px" placeholder="Jelaskan mengapa laporan ini ditolak"></textarea>
      <span class="hint">Alasan ini dapat dilihat oleh pelapor.</span></div>
    <button class="btn btn-primary btn-block" type="submit"><i data-lucide="circle-x" class="i"></i>Tolak laporan</button>
  </form>
</div></div>
