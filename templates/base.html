<!doctype html>
<html lang="{{ lang }}" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% block title %}ITSB FIND — Kehilangan Sesuatu? Mari Temukan.{% endblock %}</title>
<meta name="description" content="ITSB FIND adalah platform Lost and Found untuk civitas akademika Institut Teknologi Sains Bandung.">
<meta name="theme-color" content="#07080c">
<script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem("itsb-theme")}catch(e){}if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark"}d.setAttribute("data-theme",t);var m=document.querySelector("meta[name=theme-color]");if(m)m.setAttribute("content",t==="light"?"#f4f5f9":"#07080c")})()</script>
{% set _b = brand() %}
{% if _b.url %}<link rel="icon" href="{{ _b.url }}">{% else %}<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e0202f'/%3E%3Ccircle cx='15' cy='15' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='m20 20 6 6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block css %}{% endblock %}
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<script id="flash-data" type="application/json">{{ flashes()|tojson }}</script>
{% block body %}{% endblock %}
<script>window.I18N={{ js_strings()|tojson }};window.__=function(s){return (window.I18N&&window.I18N[s])||s}</script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/interactions.js') }}"></script>
{% block js %}{% endblock %}
</body>
</html>
